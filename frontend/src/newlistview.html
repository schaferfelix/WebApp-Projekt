<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Creator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<script src="searchfunction.js"></script>

<body>

    <header class="site-header">
        <a href="homeview.html">LIST CREATOR</a>
        <form class="search-bar" id="search-form">
            <div class="search-label">SEARCH PUBLIC LISTS</div>
            <input type="text" class="search-bar-input" id="search-input" placeholder="AWAITING INPUT..." />
        </form>
        <nav aria-label="Navigation">
            <ul>
                <li><a href="accountview.html">My Lists</a></li>
                <li><a href="sign-in.html">Sign in</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="new-list">
            <h2>Create New List</h2>
            <form id="new-list-form">
                <div class="form-group">
                    <label for="list-name">List Name:</label>
                    <input type="text" id="list-name" name="list-name" required />
                </div>
                <div class="form-group">
                    <label for="list-public">make public?:</label>
                    <input type="checkbox" id="list-public" name="list-public" />
                </div>
                <button type="button" class="create-criteria-button">NEW CRITERIA</button>
                <button class="submit-list-creation-button" type="submit">CREATE LIST</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>List Creator · A Schäfer project</p>
    </footer>

</body>
</html>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('new-list-form');
        const criteriaContainer = document.querySelector('.form-group');
        const createCriteriaBtn = document.querySelector('.create-criteria-button');

        let criterionCount = 0;

        createCriteriaBtn.addEventListener('click', () => {
            const criterionDiv = document.createElement('div');
            criterionDiv.className = 'criterion-group';
            criterionDiv.innerHTML = `
                <div class="form-group">
                    <label for="criterion-name-${criterionCount}">Aspect Name:</label>
                    <input type="text" id="criterion-name-${criterionCount}" name="criterion-name" placeholder="e.g., Music" required />
                </div>
                <div class="form-group">
                    <label for="criterion-type-${criterionCount}">Type:</label>
                    <select id="criterion-type-${criterionCount}" name="criterion-type">
                        <option value="rating">Rating (1–10)</option>
                        <option value="text">Text</option>
                        <option value="checkbox">Checkbox</option>
                    </select>
                </div>
            `;

            const submitBtn = document.querySelector('.submit-list-creation-button');
            form.insertBefore(criterionDiv, submitBtn);

            criterionCount++;
        });

        form.addEventListener('submit', (e) => {
            const listName = document.getElementById('list-name').value.trim();
            if (!listName) {
                e.preventDefault();
                alert('Please enter a list name before creating.');
            }
        });
    });
</script>
