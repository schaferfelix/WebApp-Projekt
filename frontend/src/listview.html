<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Creator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">
        <a href="homeview.html">List Creator</a>
        <nav aria-label="Navigation">
            <ul>
                <li><a href="#my-lists">My Lists</a></li>
                <li><a href="sign-in.html">Sign in</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="list-table">
            <h2 id="list-title"></h2>
            <table class="list-table">
                <thead class="list-table-head">
                    <tr>
                    </tr>
                </thead>
                <tbody class="list-table-body"></tbody>
            </table>
        </section>
    </main>


    <footer class="site-footer">
        <p>List Creator · A Schäfer project</p>
    </footer>

</body>
</html>

<script>
    async function loadTestData() {
        try {
            const data = (await fetch('/data.json')).json();
            console.log(data);
            return data;
        } catch (error) {
            console.error('loading test data failed', error);
            return { lists: []};
        }
    }

    async function populateListView() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) {
                document.getElementById('list-title').textContent = 'No list selected';
                return;
            }

            const data = await loadTestData();
            const list = data.lists.find(l => l.id == id);

            if (!list) {
                document.getElementById('list-title').textContent = 'List not found';
                return;
            }

            document.getElementById('list-title').textContent = list.name;

            const entryKeys = Object.keys(list.entries[0]).filter(k => k !== 'id');
            const headerRow = document.querySelector('.list-table-head tr');
            entryKeys.forEach(key => {
                const th = document.createElement('th');
                th.textContent = key.replace('-', ' ');
                headerRow.appendChild(th);
            });
            const th = document.createElement('th');
            headerRow.appendChild(th);

            const tbody = document.querySelector('.list-table-body');
            tbody.innerHTML = '';

            list.entries.forEach(entry => {
                const tr = document.createElement('tr');

                entryKeys.forEach(key => {
                    const td = document.createElement('td');
                    td.textContent = entry[key];
                    tr.appendChild(td);
                });

                const editCell = document.createElement('td');
                const editBtn = document.createElement('button');
                editBtn.className = 'edit-list-entry-button';
                editBtn.textContent = 'edit';
                editCell.appendChild(editBtn);
                tr.appendChild(editCell);

                tbody.appendChild(tr);
            });
        }

        document.addEventListener('DOMContentLoaded', populateListView);
</script>
