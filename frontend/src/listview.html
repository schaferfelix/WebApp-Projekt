<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Creator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">
        <a href="homeview.html">List Creator</a>
        <nav aria-label="Navigation">
            <ul>
                <li><a href="#my-lists">My Lists</a></li>
                <li><a href="sign-in.html">Sign in</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="list-table">
            <h2>Movies</h2>
            <table class="list-table">
                <thead class="list-table-head">
                    <tr>
                        <th>Name</th>
                        <th>Costume Design</th>
                        <th>Acting Performance</th>
                        <th>Music</th>
                    </tr>
                </thead>
                <tbody class="list-table-body">
                    <tr>
                        <th>Star Wars: A New Hope</th>
                        <td>5</td>
                        <td>9</td>
                        <td>10</td>
                        <td>
                            <button class="edit-list-entry-button">
                                edit
                            </button>
                        </td>
                    </tr>

                    <tr>
                        <th>Terminator</th>
                        <td>6</td>
                        <td>8</td>
                        <td>9</td>
                        <td>
                            <button class="edit-list-entry-button">
                                edit
                            </button>
                        </td>
                    </tr>
                </tbody>

            </table>
        </section>
    </main>


    <footer class="site-footer">
        <p>List Creator · A Schäfer project</p>
    </footer>

</body>
</html>
